<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PAN Verification Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 30px;
    }
    .card {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }
    input[type="file"] {
      width: 100%;
      margin-top: 6px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      font-size: 16px;
      border: none;
      background: #2563eb;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      background: #9ca3af;
    }
    pre {
      background: #111827;
      color: #e5e7eb;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      overflow-x: auto;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>PAN Verification Test</h2>

    <label>PAN Card Image</label>
    <input type="file" id="panImage" accept="image/*" />

    <label>Customer Photo</label>
    <input type="file" id="customerPhoto" accept="image/*" />

    <label>Signature Image (optional)</label>
    <input type="file" id="signatureImage" accept="image/*" />

    <button onclick="submitForm()">Verify PAN</button>

    <pre id="result">Waiting for response...</pre>
  </div>

  <script>
    async function submitForm() {
      const pan = document.getElementById("panImage").files[0];
      const customer = document.getElementById("customerPhoto").files[0];
      const sign = document.getElementById("signatureImage").files[0];

      if (!pan || !customer) {
        alert("PAN image and customer photo are required");
        return;
      }

      const formData = new FormData();
      formData.append("panImage", pan);
      formData.append("customerPhoto", customer);
      if (sign) formData.append("signatureImage", sign);

      document.getElementById("result").textContent = "Processing...";

      try {
        const res = await fetch("http://localhost:5678/webhook-test/pan-verify", {
          method: "POST",
          body: formData
        });

        const data = await res.json();
        document.getElementById("result").textContent =
          JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById("result").textContent =
          "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
